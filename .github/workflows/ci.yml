name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install native Pi SDK
        run: npm install --prefix "$RUNNER_TEMP/pi-sdk" @earendil-works/pi-coding-agent@1.0.4
      - run: npm run release:check
        env:
          PI_SDK_ROOT: ${{ runner.temp }}/pi-sdk/node_modules/@earendil-works/pi-coding-agent
